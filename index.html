<body>
  <!-- HERO (cyberpunk) — nav integrated as overlay; footer-block bottom-left
       with about copy + CTAs; "HORVATH" anchors bottom-right; the left
       half is frosted (white blur) so the AUGUST cutout reads against it. -->
  <section id="hero" class="hero-cyberpunk">
    <video class="hero-cyberpunk__bg-video" autoplay muted loop playsinline src="https://cdn.august.style/media/home-anim/hero-cyberpunk-FINAL.mp4"></video>
    <!-- Subtle full-image scrim (sits above the video, below the left blur) so
         the +contact link reads over the bright right half without muddying the
         frosted left. -->
    <div class="hero-cyberpunk__scrim" aria-hidden="true"></div>
    <div class="hero-cyberpunk__blur"></div>

    <!-- Integrated nav: logo + lowercase +prefix links (left), contact label (right). -->
    <nav class="hero-cyberpunk__nav site-nav" id="siteNav" aria-label="Primary">
      <a href="#hero" class="hero-cyberpunk__logo" aria-label="Home">
        <img src="/assets/favicon/favicon.svg" alt="">
      </a>
      <ul class="hero-cyberpunk__nav-links">
        <li><a href="/section.html">+work</a></li>
        <li><a href="#process">+process</a></li>
        <li><a href="#credentials">+about</a></li>
      </ul>
      <a href="mailto:sean@august.style" class="hero-cyberpunk__contact">+contact</a>
    </nav>
    <!-- AUGUST cutout — top-left over the frosted half. -->
    <div class="hero-cyberpunk__name hero-cyberpunk__name--top"><h1>AUGUST</h1></div>

    <!-- HORVATH cutout — bottom-right, over the unfrosted half. -->
    <div class="hero-cyberpunk__name hero-cyberpunk__name--bottom"><span aria-hidden="true">HORVATH</span></div>

    <!-- Subtle vertical rule on the left edge connecting the nav area
         down to the footer-block ABOUT label (annotation #3 in the
         EMBER reference). -->
    <div class="hero-cyberpunk__rule" aria-hidden="true"></div>

    <!-- Footer block: small ABOUT label + body line + CTA row + social links.
         Sits in the bottom-left of the frosted half. -->
    <div class="hero-cyberpunk__footer">
      <div class="hero-cyberpunk__about-block">
        <div class="hero-cyberpunk__about-label">ABOUT</div>
        <p class="hero-cyberpunk__about" id="heroAboutLine"></p>
      </div>
      <div class="hero-cyberpunk__cta-row">
        <ul class="hero-cyberpunk__socials" aria-label="Social">
          <li><a href="https://github.com/seanivore" target="_blank" rel="noopener">github</a></li>
          <li><a href="https://www.linkedin.com/in/seanivore/" target="_blank" rel="noopener">linkedin</a></li>
          <li><a href="https://www.behance.net/seanivore" target="_blank" rel="noopener">behance</a></li>
        </ul>
        <a href="/section.html" class="hero-cyberpunk__cta">
          <span class="hero-cyberpunk__cta-label">explore the work <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </div>
  </section>

  <!-- NARRATIVE SPINE -->
  <section id="narrative-spine" class="spine"></section>

  <!-- FEATURED TILES -->
  <section id="featured-tiles" class="feature-tiles"></section>

    </div>

      <!-- Populated by landing-controller.js -->
    </div>
    <div class="process-indicator"><span></span><span></span><span></span></div>
  </section>

  <!-- CREDENTIALS -->

    </div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="achievements sr" id="achievements">
    <div class="container">
      <div class="achievements__inner">
        <h2 class="section-heading" id="achievementsHeading"><!-- JS --></h2>

          <!-- Populated by landing-controller.js — expandable accordion items -->
        </div>
      </div>
    </div>
  </section>

  <!-- CTA TRIO — small/minimal spacer before the CTA -->
  <div class="cta-trio cta-trio--minimal"><span></span><span></span><span></span></div>

  <!-- CTA -->
  <section class="cta-section sr" id="ctaSection">
    <div class="container">
      <h2 class="cta-heading" id="ctaHeading"><!-- JS --></h2>
      <div class="cta-buttons" id="ctaButtons">
        <!-- Populated by landing-controller.js -->

    </div>
  </section>

  <!-- CTA TRIO — big animated finisher AFTER the CTA -->
  <div class="cta-trio cta-trio--full sr"><span></span><span></span><span></span></div>
