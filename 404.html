<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        /**
         * 404 ROUTING HANDLER - Manifest-Based (Future-Proof)
         * 
         * Strategy: Check manifest to determine page type
         * - Path exists in manifest.entries → entry page
         * - Path doesn't exist → section page
         * 
         * Benefits:
         * - Future-proof: Works with any URL depth
         * - Flexible: Supports /web/sub/another/break/slug
         * - Robust: One source of truth (manifest)
         */
        (async function () {
            const path = window.location.pathname;
            const cleanPath = path.replace(/^\/|\/$/g, ''); // Remove leading/trailing slashes

            try {
                // Load manifest to check if this is an entry page
                const response = await fetch('/assets/js/manifest.json');

                if (!response.ok) {
                    // Manifest not found - default to section page
                    console.warn('Manifest not found, defaulting to section page');
                    sessionStorage.setItem('sectionPath', path);
                    window.location.replace('/section.html');
                    return;
                }

                const manifest = await response.json();

                // Check if path exists in entry mappings
                if (manifest.entries && manifest.entries[cleanPath]) {
                    // This is an entry page
                    sessionStorage.setItem('entryPath', path);
                    window.location.replace('/entry.html');
                } else {
                    // This is a section page
                    sessionStorage.setItem('sectionPath', path);
                    window.location.replace('/section.html');
                }

            } catch (error) {
                // Error loading manifest - default to section page
                console.error('Error loading manifest:', error);
                sessionStorage.setItem('sectionPath', path);
                window.location.replace('/section.html');
            }
        })();
    </script>
</head>

<body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #666;">
        Redirecting...
    </p>
</body>

</html>
