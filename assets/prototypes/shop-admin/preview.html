<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Preview · Everlastings by Emaline</title>
<link rel="stylesheet" href="portal.css">
<style>
/* ===================== Storefront product preview ===================== */
body{background:var(--bg); color:var(--ink);}
.store-top{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; padding:14px 22px;
  background:color-mix(in oklch,var(--surface),transparent 8%); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline);}
.store-top__brand{font-family:var(--font-display,var(--font-body)); font-size:var(--t-lg); font-weight:600; letter-spacing:-.01em; text-decoration:none; color:inherit; cursor:pointer;}
.store-top__nav{display:flex; gap:18px; margin-left:6px;}
.store-top__nav a{font-size:var(--t-sm); font-weight:600; color:var(--ink-muted); text-decoration:none; cursor:pointer;}
.store-top__nav a:hover{color:var(--ink);}
@media (max-width:620px){.store-top__nav{display:none;}}
.store-top__tag{font-size:var(--t-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-strong);
  background:var(--accent-soft); border:1px solid color-mix(in oklch,var(--accent),white 65%); padding:3px 9px; border-radius:var(--r-pill);}
.store-top__back{margin-left:auto; font-size:var(--t-sm); font-weight:600; color:var(--ink-muted); text-decoration:none; display:inline-flex; align-items:center; gap:6px;}
.store-top__back:hover{color:var(--ink);}

.pdp{max-width:1120px; margin:0 auto; padding:28px 22px 64px; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:40px;}
@media (max-width:880px){.pdp{grid-template-columns:1fr; gap:28px;}}

/* media */
.gallery{display:flex; flex-direction:column; gap:12px; position:sticky; top:78px; align-self:start;}
@media (max-width:880px){.gallery{position:static;}}
.stage{position:relative; width:100%; aspect-ratio:4/5; background:var(--surface-sunk); border:1px solid var(--hairline);
  border-radius:var(--r-lg); overflow:hidden; display:flex; align-items:center; justify-content:center;}
.stage img,.stage video{width:100%; height:100%; object-fit:contain; display:block; background:#11131a;}
.stage iframe{width:100%; height:100%; border:0;}
.thumbs{display:flex; gap:8px; flex-wrap:wrap;}
.thumb{position:relative; width:62px; height:62px; flex:none; border-radius:var(--r-md); overflow:hidden; cursor:pointer;
  border:1px solid var(--hairline); background:var(--surface-sunk); padding:0;}
.thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.thumb.is-active{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in oklch,var(--accent),transparent 55%);}
.thumb__play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.35)); font-size:18px;}
.thumb__badge{position:absolute; bottom:3px; left:3px; font-size:9px; font-weight:700; letter-spacing:.04em; color:#fff;
  background:rgba(0,0,0,.55); padding:1px 5px; border-radius:6px; text-transform:uppercase;}

/* info */
.info{display:flex; flex-direction:column; gap:16px;}
.info__series{font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
.info h1{margin:2px 0 0; font-family:var(--font-display,var(--font-body)); font-size:clamp(26px,3.4vw,38px); font-weight:600; letter-spacing:-.02em; line-height:1.08;}
.info__headline{font-size:var(--t-lg); color:var(--ink-muted); font-style:italic; line-height:1.4;}
.price{display:flex; align-items:baseline; gap:12px; margin-top:2px;}
.price__now{font-size:var(--t-2xl,28px); font-weight:600; font-family:var(--font-data);}
.price__was{font-size:var(--t-base); color:var(--ink-faint); text-decoration:line-through; font-family:var(--font-data);}
.price__chip{font-size:var(--t-xs); font-weight:700; color:#fff; background:var(--live); padding:2px 8px; border-radius:var(--r-pill);}
.soldout{font-size:var(--t-sm); font-weight:700; color:var(--sold); text-transform:uppercase; letter-spacing:.05em;}
.buy{display:flex; gap:10px; align-items:center; margin-top:4px;}
.buy .btn{flex:1;}
.stock{font-size:var(--t-xs); color:var(--ink-muted);}
.story{font-size:var(--t-base); line-height:1.65; color:var(--ink); background:var(--surface-sunk);
  border-left:3px solid var(--accent); padding:14px 16px; border-radius:0 var(--r-md) var(--r-md) 0;}
.desc{font-size:var(--t-base); line-height:1.6; color:var(--ink);}
.note{font-size:var(--t-sm); line-height:1.55; color:var(--ink-muted); font-style:italic;}
.sec{border-top:1px solid var(--hairline); padding-top:14px;}
.sec h3{margin:0 0 8px; font-size:var(--t-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted);}
.sec ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px;}
.sec li{font-size:var(--t-sm); line-height:1.45;}
.specs{display:grid; grid-template-columns:auto 1fr; gap:5px 16px; font-size:var(--t-sm);}
.specs dt{color:var(--ink-faint);} .specs dd{margin:0; font-family:var(--font-data);}
.missing{max-width:520px; margin:18vh auto; text-align:center; color:var(--ink-muted);}
</style>
</head>
<body>
<div class="store-top">
  <a class="store-top__brand" href="#" data-nono>Everlastings <span style="color:var(--ink-faint); font-weight:400">by Emaline</span></a>
  <nav class="store-top__nav">
    <a href="#" data-nono>Shop all</a>
    <a href="#" data-nono>Collections</a>
    <a href="#" data-nono>About</a>
  </nav>
  <span class="store-top__tag">Preview</span>
  <a class="store-top__back" href="products.html">← Back to admin</a>
</div>
<div id="pdp"></div>
<script src="data.js"></script>
<script src="preview-app.js"></script>
</body>
</html>
